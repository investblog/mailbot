  <header class="popup__header">
    <div class="popup__header-left">
      <img class="brand-icon" src="/icon/48.png" alt="" width="26" height="26" />
      <div class="brand-text">
        <b class="popup__title" data-i18n="title">MailBot</b>
        <span class="brand-sub" data-i18n="tagline"></span>
      </div>
    </div>
    <div class="popup__header-actions">
      <button id="pin" class="icon-btn" type="button" data-i18n-title="pin" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-panel-open"></use></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" data-i18n-title="toggleTheme">
        <svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>
  </header>

  <div class="popup__body">
    <section class="addr-card">
      <div class="addr-row">
        <code id="addr">…</code>
        <button id="copy-addr" class="icon-btn" type="button" data-i18n-title="copy">
          <svg class="ic" aria-hidden="true"><use href="#i-copy"></use></svg>
        </button>
      </div>
      <div class="addr-meta" id="addr-meta"></div>
      <div class="addr-actions">
        <button id="new" class="btn btn--tg" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-mail-plus"></use></svg><span data-i18n="new"></span>
        </button>
        <button id="extend" class="btn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-clock-plus"></use></svg><span data-i18n="extend"></span>
        </button>
        <button id="delete" class="btn btn--ghost" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-trash"></use></svg><span data-i18n="delete"></span>
        </button>
      </div>
    </section>

    <section class="inbox">
      <h2 class="inbox__title" data-i18n="inbox"></h2>
      <div id="list" class="list"></div>
    </section>
  </div>

  <div class="popup__footer">

    </div>
    <div class="footer-social-group">
      <a class="footer-social" href="https://github.com/investblog/mailbot" target="_blank" rel="noopener" data-i18n-title="github">
