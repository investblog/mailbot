<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></symbol>
    <symbol id="i-telegram" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.78a1.2 1.2 0 0 0-1.27-.18L3.4 11.36c-.86.34-.83 1.58.05 1.87l4.3 1.43 1.62 5.02c.2.6.96.78 1.4.32l2.4-2.46 4.34 3.2c.5.37 1.22.1 1.36-.5l3.1-14.3a1.2 1.2 0 0 0-.43-1.18ZM9.6 14.2l8.1-5.02-6.55 6.16a1 1 0 0 0-.3.58l-.26 1.95-1-3.67Z"/></symbol>
    <symbol id="i-github" viewBox="0 0 20 20" fill="currentColor"><path d="M10 0a10 10 0 0 0-3.16 19.49c.5.08.68-.22.68-.48 0-.23-.01-1.02-.01-1.86-2.51.46-3.16-.61-3.36-1.18a3.64 3.64 0 0 0-1.03-1.41c-.35-.19-.85-.65-.01-.66a2 2 0 0 1 1.54 1.03 2.13 2.13 0 0 0 2.91.82 2.1 2.1 0 0 1 .64-1.34c-2.23-.25-4.55-1.11-4.55-4.94a3.9 3.9 0 0 1 1.03-2.69 3.6 3.6 0 0 1 .1-2.65s.84-.26 2.75 1.03a9.43 9.43 0 0 1 5 0c1.91-1.3 2.75-1.03 2.75-1.03a3.6 3.6 0 0 1 .1 2.65 3.87 3.87 0 0 1 1.03 2.69c0 3.84-2.34 4.69-4.56 4.94a2.37 2.37 0 0 1 .67 1.85c0 1.34-.01 2.41-.01 2.75 0 .26.18.57.69.47A10 10 0 0 0 10 0"/></symbol>
  </svg>

  <header class="popup__header">
    <div class="popup__header-left">
      <img class="brand-icon" src="/icon/48.png" alt="" width="26" height="26" />
      <div class="brand-text">
        <b class="popup__title" data-i18n="title">MailBot</b>
        <span class="brand-sub" data-i18n="tagline"></span>
      </div>
    </div>
    <div class="popup__header-actions">
      <button id="pin" class="icon-btn" type="button" data-i18n-title="pin" hidden>
        <svg class="ic" aria-hidden="true"><use href="#i-pin"></use></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" data-i18n-title="toggleTheme">
        <svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
    </div>
  </header>

  <div class="popup__body">
    <section class="addr-card">
      <div class="addr-row">
        <code id="addr">…</code>
        <button id="copy-addr" class="icon-btn" type="button" data-i18n-title="copy">
          <svg class="ic" aria-hidden="true"><use href="#i-copy"></use></svg>
        </button>
      </div>
      <div class="addr-meta" id="addr-meta"></div>
      <div class="addr-actions">
        <button id="new" class="btn btn--tg" type="button" data-i18n="new"></button>
        <button id="extend" class="btn" type="button" data-i18n="extend"></button>
        <button id="delete" class="btn btn--ghost" type="button" data-i18n="delete"></button>
      </div>
    </section>

    <section class="inbox">
      <h2 class="inbox__title" data-i18n="inbox"></h2>
      <div id="list" class="list"></div>
    </section>
  </div>

  <div class="popup__footer">
    <a class="footer-link" href="https://t.me/gotemailbot" target="_blank" rel="noopener" data-i18n="open_tg"></a>
    <a class="icon-link" href="https://github.com/investblog/mailbot" target="_blank" rel="noopener" data-i18n-title="github">
      <svg class="ic" aria-hidden="true"><use href="#i-github"></use></svg>
    </a>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
